<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Expense Tracker</h2>

        <div class="balance-container">
            <h2>Your Balance</h2>
            <div class="remaining-balance">$0.00</div>
            <div class="in-ex-container">
                <div class="income-div in-ex-divs">
                    <p>Income</p>
                    <div class="income">$0.00</div>
                </div>
                <div class="expense-div in-ex-divs">
                    <p>Expenses</p>
                    <div class="expense">$0.00</div>
                </div>
            </div>
        </div>

        <div class="transaction">
            <div class="transaction-container">
                <h2>Transactions</h2>

                <div class="transaction-list-container">
                    <div class="transaction-list transaction-income">
                        <div class="transaction-income-description">Salary</div>
                        <div class="transaction-income-value">
                            <span>$2000.00</span>
                            <button>X</button>
                        </div>
                    </div>
                    
                    <div class="transaction-expense">
                        <div class="transaction-list">
                            <div class="transaction-expense-description">Airpods</div>
                            <div class="transaction-expense-value">
                                <span>$100.00</span>
                                <button>X</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="add-transaction">
                <h2>Add Transaction</h2>
                <form>
                    <div class="description">
                        <h4>Description</h4>
                        <input type="text" placeholder="Enter description...">
                    </div>
                    <div class="amount">
                        <h4>Amount</h4>
                        <input type="text" placeholder="Enter amount...">
                        <p>Use negative (-) for expenses</p>
                    </div>
                    <button id="add-transaction-btn">Add Transaction</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
